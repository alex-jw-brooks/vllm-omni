# Granite ProsodyLM TTS deploy config.
# Stage 0: text normalization (AR) — generates normalized text until [SEP_NORM].
# Stage 1: prosody prediction (NAR) — iterative masked decode via NAR heads.
# Stage 2: StyleTTS2 waveform synthesis — deferred.

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.4
    trust_remote_code: true
    enable_prefix_caching: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: bfloat16
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
      # [SEP_NORM] = 100356
      stop_token_ids: [100356]

  - stage_id: 1
    max_num_seqs: 4
    gpu_memory_utilization: 0.4
    trust_remote_code: true
    enable_prefix_caching: false
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: bfloat16
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 4096
