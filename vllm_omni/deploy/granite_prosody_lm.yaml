# Granite ProsodyLM TTS deploy: granite_lm (text norm + prosody) → styletts2.
# Stage 0 is called twice by the orchestrator: once for text normalization
# (EOS=[SEP_NORM]), once for prosody prediction (EOS=[SEP_2], grammar-constrained).
#
# The grammar logits processor is registered on Stage 0 but only activates when
# the request carries extra_args.prosody_grammar (i.e., the prosody call).

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    enable_prefix_caching: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: bfloat16
    devices: "0"
    logits_processors:
      - "vllm_omni.model_executor.models.granite_prosody_lm.prosody_grammar_logits_processor:ProsodyGrammarLogitsProcessor"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
      # TODO: read from config.sep2_token_id instead of hardcoding
      stop_token_ids: [100355]

  # TODO: uncomment when StyleTTS2 stage is implemented
