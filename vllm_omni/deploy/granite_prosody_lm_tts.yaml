# Granite ProsodyLM TTS — full 3-stage pipeline.
# Stage 0: text normalization (NLE/CTC) — single forward + CTC decode.
# Stage 1: prosody prediction (NAR) — iterative masked decode via NAR heads.
# Stage 2: StyleTTS2 waveform synthesis.

async_chunk: false
trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    gpu_memory_utilization: 0.20
    enforce_eager: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: bfloat16
    devices: "0"

  - stage_id: 1
    gpu_memory_utilization: 0.20
    enforce_eager: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: bfloat16
    devices: "0"

  - stage_id: 2
    max_num_seqs: 1
    gpu_memory_utilization: 0.10
    enforce_eager: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: float32
    devices: "0"
