# Granite ProsodyLM deploy config — full TTS pipeline.
# Stage 0: text normalization (AR) — generates normalized text until [SEP_NORM].
# Stage 1: prosody prediction (NAR) — iterative masked decode via NAR heads.
# Stage 2: StyleTTS2 waveform synthesis — converts prosody to audio.

async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.20
    trust_remote_code: true
    async_scheduling: false
    enable_prefix_caching: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: bfloat16
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
      # [SEP_NORM] = 100356
      stop_token_ids: [100356]

  - stage_id: 1
    max_num_seqs: 4
    gpu_memory_utilization: 0.20
    trust_remote_code: true
    async_scheduling: false
    enforce_eager: true
    enable_prefix_caching: false
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: bfloat16
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 4096

  - stage_id: 2
    max_num_seqs: 1
    gpu_memory_utilization: 0.10
    trust_remote_code: true
    async_scheduling: false
    enforce_eager: true
    enable_prefix_caching: false
    max_num_batched_tokens: 4096
    max_model_len: 4096
    dtype: float32
    devices: "0"
